<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e63946">
<meta name="description" content="GoMandu — food delivery, grocery delivery and ride booking in one app.">
<title>GoMandu | Food, Grocery & Rides</title>
<link rel="icon" type="image/png" href="gomandu-logo.png">
<link rel="apple-touch-icon" href="gomandu-logo.png">
<style>
:root{--red:#e63946;--red-dark:#c92d3a;--dark:#1d1f23;--muted:#6b7078;--line:#eceae6;--soft:#f7f8f7;--green:#168653;--radius:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--dark);background:#fff;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
.container{width:min(1140px,92%);margin:auto}
:focus-visible{outline:3px solid #e6394666;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{position:relative;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:inline-flex;align-items:center;color:var(--red);white-space:nowrap;font-size:27px;font-weight:900;text-decoration:none;letter-spacing:-1px}.logo span{color:var(--dark)}.logo img{margin-right:8px;flex:none}
.nav-links{display:flex;align-items:center;gap:26px}
.nav-links a{text-decoration:none;font-size:14px;font-weight:700;color:#3c4046}.nav-links a:hover{color:var(--red)}
.auth-buttons{display:flex;align-items:center;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,transform .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-dark)}
.btn-ghost{background:#fff;color:var(--dark);border:1px solid var(--line)}.btn-ghost:hover{border-color:var(--dark)}
.btn-block{width:100%}
.cart-btn{position:relative}
.badge{background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:2px 7px;min-width:20px;text-align:center}
.m-auth{display:none;gap:10px}
.menu-toggle{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:18px}

/* Modals & drawer */
.gmx-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;place-items:center;backdrop-filter:blur(4px)}
.gmx-modal.open{display:grid}
.gmx-modal-box{background:#fff;padding:30px;border-radius:20px;width:min(420px,92%);max-height:92vh;overflow:auto;box-shadow:0 20px 40px #00000026;position:relative}
.gmx-modal-close{position:absolute;top:14px;right:18px;font-size:24px;background:none;border:0;color:var(--muted)}
.gmx-modal h3{margin:0 0 18px;font-size:22px;letter-spacing:-.5px}
.gmx-form-field{display:grid;gap:6px;margin-bottom:14px;font-size:13px;font-weight:700}
.gmx-form-field input,.gmx-form-field select{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-weight:400;width:100%;background:#fff}
.gmx-form-field input:focus,.gmx-form-field select:focus{outline:2px solid #e6394655;border-color:var(--red)}
.gmx-modal-toggle{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.gmx-modal-toggle span{color:var(--red);font-weight:700;cursor:pointer}
.form-error{color:var(--red);font-size:13px;min-height:18px;margin:-4px 0 10px}
.drawer-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#fff;z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer-head h3{margin:0}
.drawer-body{flex:1;overflow:auto;padding:12px 22px}
.drawer-foot{padding:18px 22px;border-top:1px solid var(--line);background:var(--soft)}
.cart-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-row .em{font-size:30px;width:52px;height:52px;display:grid;place-items:center;background:#fff2e9;border-radius:12px}
.cart-row .info{flex:1;min-width:0}.cart-row .info b{display:block;font-size:14px}.cart-row .info small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800}
.qty button:hover{border-color:var(--red);color:var(--red)}
.sum{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:var(--muted)}
.sum.total{color:var(--dark);font-weight:900;font-size:18px;margin:12px 0 14px}
.promo{display:flex;gap:8px;margin-bottom:12px}
.promo input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.empty{padding:35px;text-align:center;color:var(--muted);grid-column:1/-1}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Hero */
.hero{background:linear-gradient(115deg,#fff0e6,#fff9f3);padding:70px 0;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:36px}
.eyebrow{color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:1.6px;font-size:12px}
h1{font-size:clamp(36px,5.2vw,60px);line-height:1.07;letter-spacing:-2px;margin:14px 0}h1 span{color:var(--red)}
.lead{color:var(--muted);line-height:1.7;max-width:500px;font-size:17px}
.search{display:flex;max-width:100%;background:#fff;padding:7px;border:1px solid var(--line);border-radius:14px;margin-top:26px;max-width:520px;box-shadow:0 10px 30px #0000000a}
.search input{width:100%;min-width:0;border:0;outline:none;padding:10px 12px;background:transparent}
.tagline{font-size:13px;margin-top:14px;color:var(--muted)}
.hero-stats{display:flex;gap:34px;margin-top:34px;flex-wrap:wrap}
.hero-stats strong{display:block;font-size:24px;letter-spacing:-.5px}.hero-stats small{color:var(--muted)}
.hero-art{border-radius:28px;background:linear-gradient(135deg,#ffd9b8,#ffb4a2);box-shadow:0 24px 60px #e6394633;transform:rotate(2deg);aspect-ratio:1/1;display:grid;place-items:center;font-size:clamp(90px,16vw,170px);position:relative}
.hero-art small{position:absolute;bottom:18px;left:18px;right:18px;background:#fff;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.hero-art small em{color:var(--green);font-style:normal}

/* Services */
.services{padding:70px 0 20px}
.section-head{text-align:center;max-width:560px;margin:0 auto 36px}
h2{margin:0 0 10px;font-size:clamp(26px,3.4vw,34px);letter-spacing:-.9px}
.sub{color:var(--muted);margin:0;line-height:1.6}
.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.service{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.service:hover{transform:translateY(-4px);box-shadow:0 14px 34px #0000001a}
.service .art{aspect-ratio:2/1;display:grid;place-items:center;font-size:64px;background:#fff2e9}
.service:nth-child(2) .art{background:#eaf7ef}.service:nth-child(3) .art{background:#eaf1fb}
.service-body{padding:20px 22px 24px}
.service h3{margin:0 0 6px;font-size:19px}
.service p{margin:0 0 14px;color:var(--muted);line-height:1.6;font-size:14px}
.service-link{color:var(--red);font-weight:800;font-size:14px;text-decoration:none;background:none;border:0;padding:0}
.service-link:hover{text-decoration:underline}

/* Menu */
.menu{padding:60px 0}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:22px;flex-wrap:wrap}
.section-heading h2{margin-bottom:6px}
.categories{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
.category{border:1px solid var(--line);background:#fff;border-radius:30px;padding:10px 16px;font-weight:700}
.category.active,.category:hover{background:var(--red);color:#fff;border-color:var(--red)}
.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.food-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;transition:transform .2s,box-shadow .2s}
.food-card:hover{transform:translateY(-4px);box-shadow:0 14px 34px #0000000d}
.food-image{height:170px;display:grid;place-items:center;font-size:72px;position:relative;background:#fff2e9}
.tag{position:absolute;top:12px;left:12px;padding:6px 9px;border-radius:7px;background:#fff;font-size:11px;font-weight:800;box-shadow:0 2px 5px #0000001a}
.food-info{padding:16px}
.food-title{display:flex;align-items:start;justify-content:space-between;gap:8px}
.food-title h3{margin:0;font-size:17px}
.rating{font-size:12px;white-space:nowrap;color:#e08a00;font-weight:700}
.food-info p{color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 0}
.food-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.price{font-weight:900;font-size:19px}
.add{border:0;background:#fff0f0;color:var(--red);padding:10px 14px;border-radius:10px;font-weight:800;transition:.2s}
.add:hover{background:var(--red);color:#fff}

/* How */
.how{background:var(--soft);padding:70px 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:step}
.step{text-align:center;padding:10px 14px}
.step::before{counter-increment:step;content:counter(step);display:grid;place-items:center;width:46px;height:46px;margin:0 auto 14px;background:var(--red);color:#fff;border-radius:50%;font-weight:800}
.step h3{margin:0 0 6px}.step p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}

/* CTA */
.cta{padding:70px 0}
.cta-box{background:linear-gradient(120deg,var(--red),#ff6b6b);color:#fff;border-radius:24px;padding:48px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.cta-box h2{margin:0 0 8px}.cta-box p{margin:0;opacity:.92}
.cta-box .btn{background:#fff;color:var(--red)}

/* Footer */
footer{background:#0b0b0c;color:#fff;padding:64px 0 28px}
.footer-grid{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:40px;margin-bottom:40px}
.footer-logo{font-size:38px;font-weight:900;letter-spacing:-1.5px;color:#fff;text-decoration:none;display:inline-block;margin-bottom:15px}.footer-logo span{color:var(--red)}
.footer-tagline{color:#8b8f96;font-size:14px;line-height:1.6;max-width:320px}
.footer-col h4{font-size:16px;margin:0 0 16px}
.footer-col ul{list-style:none;padding:0;margin:0}.footer-col li{margin-bottom:12px}
.footer-col a{color:#8b8f96;text-decoration:none;font-size:14px}.footer-col a:hover{color:#fff}
.footer-bottom{border-top:1px solid #23252a;padding-top:22px;color:#8b8f96;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(max-width:860px){
 .hero-grid,.footer-grid{grid-template-columns:1fr}
 .service-grid,.food-grid,.steps{grid-template-columns:1fr 1fr}
 .menu-toggle{display:block}
 .nav-links{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;flex-direction:column;align-items:flex-start;padding:18px 4%;border-bottom:1px solid var(--line);gap:16px}
 .nav-links.open{display:flex}
 .hero-art{width:100%;max-width:340px;margin:auto}
 .nav-links.open .m-auth{display:flex}
 .auth-buttons .hide-sm{display:none}
 .nav{min-height:64px}.nav-links{top:64px}
}
@media(max-width:560px){
 .service-grid,.food-grid,.steps{grid-template-columns:1fr}
 .cta-box{padding:30px}.cart-btn .cl{display:none}.cart-btn{padding:10px 12px}.logo{font-size:23px}.hero{padding:44px 0}.hero-art small{font-size:12px;flex-direction:column;gap:2px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
